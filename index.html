<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#1e1e2f;
    font-family:Arial, sans-serif;
}

.calculator{
    background:#2c2c3e;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
    width:320px;
}

#display{
    width:100%;
    height:60px;
    border:none;
    outline:none;
    margin-bottom:15px;
    font-size:24px;
    text-align:right;
    padding:10px;
    border-radius:10px;
    background:#111;
    color:#0f0;
}

.buttons{
    display:grid;
    grid-template-columns: repeat(5, 1fr);
    gap:10px;
}

button{
    height:50px;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    background:#3b3b55;
    color:white;
    transition:0.2s;
}

button:hover{
    background:#57577a;
}

.operator{
    background:#ff9500;
}

.operator:hover{
    background:#ffa733;
}

.equal{
    background:#28a745;
    grid-column: span 2;
}

.equal:hover{
    background:#34c759;
}

.clear{
    background:#dc3545;
}

.clear:hover{
    background:#ff4d5a;
}
</style>
</head>

<body>

<div class="calculator">
<input type="text" id="display" readonly>

<div class="buttons">

<button onclick="clearDisplay()" class="clear">C</button>
<button onclick="deleteLast()">DEL</button>
<button onclick="append('%')">%</button>
<button onclick="append('/')">÷</button>
<button onclick="append('*')">×</button>

<button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('-')">−</button>
<button onclick="sqrt()">√</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('+')">+</button>
<button onclick="power()">x²</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="sin()">sin</button>
<button onclick="cos()">cos</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="log()">log</button>
<button onclick="tan()">tan</button>
<button onclick="calculate()" class="equal">=</button>

</div>
</div>

<script>

let display = document.getElementById("display");

function append(value){
    display.value += value;
}

function clearDisplay(){
    display.value = "";
}

function deleteLast(){
    display.value = display.value.slice(0,-1);
}

function calculate(){
    try{
        display.value = eval(display.value);
    }catch{
        display.value = "Error";
    }
}

function sqrt(){
    display.value = Math.sqrt(eval(display.value));
}

function power(){
    display.value = Math.pow(eval(display.value),2);
}

function sin(){
    display.value = Math.sin(toRadians(eval(display.value))).toFixed(6);
}

function cos(){
    display.value = Math.cos(toRadians(eval(display.value))).toFixed(6);
}

function tan(){
    display.value = Math.tan(toRadians(eval(display.value))).toFixed(6);
}

function log(){
    display.value = Math.log10(eval(display.value)).toFixed(6);
}

function toRadians(deg){
    return deg * (Math.PI/180);
}

</script>

</body>
</html>
