<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator</title>

<style>
    body {
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
    }

    .calculator {
        background: #1c1c1c;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        width: 350px;
    }

    #display {
        width: 100%;
        height: 60px;
        font-size: 24px;
        text-align: right;
        padding: 10px;
        border: none;
        border-radius: 10px;
        margin-bottom: 15px;
        background: #333;
        color: white;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
    }

    button {
        padding: 15px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        opacity: 0.8;
    }

    .operator { background: #ff9500; color: white; }
    .function { background: #505050; color: white; }
    .number { background: #2e2e2e; color: white; }
    .equal { background: #28a745; color: white; grid-column: span 2; }
    .clear { background: #dc3545; color: white; }
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" disabled>

    <div class="buttons">
        <button class="function" onclick="clearDisplay()">C</button>
        <button class="function" onclick="deleteLast()">DEL</button>
        <button class="function" onclick="appendValue('(')">(</button>
        <button class="function" onclick="appendValue(')')">)</button>
        <button class="operator" onclick="appendValue('/')">÷</button>

        <button class="function" onclick="appendFunction('sin')">sin</button>
        <button class="function" onclick="appendFunction('cos')">cos</button>
        <button class="function" onclick="appendFunction('tan')">tan</button>
        <button class="function" onclick="appendFunction('log')">log</button>
        <button class="operator" onclick="appendValue('*')">×</button>

        <button class="function" onclick="appendFunction('sqrt')">√</button>
        <button class="function" onclick="appendValue('**2')">x²</button>
        <button class="function" onclick="appendValue('**')">xʸ</button>
        <button class="function" onclick="appendValue(Math.PI)">π</button>
        <button class="operator" onclick="appendValue('-')">−</button>

        <button class="number" onclick="appendValue('7')">7</button>
        <button class="number" onclick="appendValue('8')">8</button>
        <button class="number" onclick="appendValue('9')">9</button>
        <button class="function" onclick="appendValue(Math.E)">e</button>
        <button class="operator" onclick="appendValue('+')">+</button>

        <button class="number" onclick="appendValue('4')">4</button>
        <button class="number" onclick="appendValue('5')">5</button>
        <button class="number" onclick="appendValue('6')">6</button>
        <button class="function" onclick="appendFunction('ln')">ln</button>
        <button class="equal" onclick="calculate()">=</button>

        <button class="number" onclick="appendValue('1')">1</button>
        <button class="number" onclick="appendValue('2')">2</button>
        <button class="number" onclick="appendValue('3')">3</button>
        <button class="number" onclick="appendValue('0')">0</button>
        <button class="number" onclick="appendValue('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById("display");
    let isDegree = true;

    function appendValue(value) {
        display.value += value;
    }

    function appendFunction(func) {
        display.value += func + "(";
    }

    function clearDisplay() {
        display.value = "";
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculate() {
        try {
            let expression = display.value;

            expression = expression.replace(/sin\(([^)]+)\)/g, (_, val) =>
                Math.sin(convertAngle(eval(val)))
            );

            expression = expression.replace(/cos\(([^)]+)\)/g, (_, val) =>
                Math.cos(convertAngle(eval(val)))
            );

            expression = expression.replace(/tan\(([^)]+)\)/g, (_, val) =>
                Math.tan(convertAngle(eval(val)))
            );

            expression = expression.replace(/log\(([^)]+)\)/g, (_, val) =>
                Math.log10(eval(val))
            );

            expression = expression.replace(/ln\(([^)]+)\)/g, (_, val) =>
                Math.log(eval(val))
            );

            expression = expression.replace(/sqrt\(([^)]+)\)/g, (_, val) =>
                Math.sqrt(eval(val))
            );

            display.value = eval(expression);
        } catch {
            display.value = "Error";
        }
    }

    function convertAngle(value) {
        return isDegree ? value * Math.PI / 180 : value;
    }
</script>

</body>
</html>
